# Pipeline parameters. Secrets live in .env, never here.

data:
  country_code: PL                # ENTSO-E bidding-zone / country code
  start_date: "2019-01-01"        # inclusive, interpreted in timezone_local
  end_date: null                  # null = up to the current hour
  timezone_local: Europe/Warsaw   # display + the calendar holidays are defined on
  raw_dir: data/raw
  processed_dir: data/processed
  dataset_filename: dataset.parquet
  # Used only when no ingested dataset exists (i.e. no ENTSO-E token yet). Long enough
  # for a two-year initial training window plus a full year of backtest origins.
  synthetic_start: "2021-01-01"
  synthetic_end: "2025-03-01"

ingestion:
  # ENTSO-E revises "actual" load after first publication and some hours publish
  # late, so each incremental run re-pulls this many days and overwrites them.
  trailing_repull_days: 14
  # ENTSO-E load is often 15-minute resolution. Values are instantaneous MW, so the
  # mean over the hour is the hourly average power — sum would be nonsense.
  load_aggregation: mean
  weather_forecast_days: 7        # horizon requested from the Open-Meteo forecast API

weather:
  archive_url: https://archive-api.open-meteo.com/v1/archive
  forecast_url: https://api.open-meteo.com/v1/forecast
  # Open-Meteo is free, keyless and occasionally slow. A timeout or a 503 on one of the
  # seven city calls must not be what ends a nightly run, so transient failures are
  # retried with exponential backoff. A 4xx other than 429 is a malformed request, not
  # bad luck, and is raised immediately rather than retried five times.
  request:
    timeout_s: 30                 # requests' connect/read timeout, per attempt
    max_attempts: 5               # 1 try plus 4 retries
    backoff_s: 1.0                # first pause; doubles each attempt
    backoff_max_s: 30.0           # ceiling, so a long outage fails in minutes not hours
  variables:
    - temperature_2m
    - wind_speed_10m
    - cloud_cover
    - relative_humidity_2m
  # Population weights, normalised at load time. Combined into a single national
  # series — demand follows where people are, not where the weather station is.
  cities:
    - {name: Warsaw,   lat: 52.23, lon: 21.01, weight: 0.30}
    - {name: Krakow,   lat: 50.06, lon: 19.94, weight: 0.16}
    - {name: Lodz,     lat: 51.76, lon: 19.46, weight: 0.12}
    - {name: Wroclaw,  lat: 51.11, lon: 17.04, weight: 0.12}
    - {name: Poznan,   lat: 52.41, lon: 16.93, weight: 0.11}
    - {name: Gdansk,   lat: 54.35, lon: 18.65, weight: 0.10}
    - {name: Szczecin, lat: 53.43, lon: 14.55, weight: 0.09}

features:
  horizon_hours: 24               # forecast load_mw[t + horizon_hours]
  rolling_window_hours: 24        # window for rolling stats, applied to an already-shifted series
  weekly_lag_hours: 168           # same hour last week — safe at any day-ahead horizon

validation:
  # Polish system load sits roughly in this band; anything outside is a data fault,
  # not a demand record. The upper bound has headroom over the observed record of
  # 28,304 MW (2024-01-09, a cold winter morning) — an earlier 28,000 bound rejected
  # four hours of genuine data, which is the validator working and the config being
  # wrong rather than the other way round.
  load_min_mw: 10000
  load_max_mw: 30000
  temp_min_c: -35.0
  temp_max_c: 45.0

model:
  horizons: [24]                  # a second horizon is a config change, not new code
  seed: 42
  validation_days: 60             # chronological validation block for early stopping
  num_boost_round: 2000
  early_stopping_rounds: 100
  quantiles: [0.1, 0.5, 0.9]      # P10/P50/P90 band
  tuning:
    # The search is a budget, not a guarantee. `timeout_s` bounds it so a backtest,
    # which tunes once and then refits at every origin, stays re-runnable.
    n_trials: 20
    timeout_s: 300

promotion:
  metric: mape
  # A candidate may be at most 2% relatively worse than the current champion before it
  # counts as a material regression. Beating the naive baseline is non-negotiable.
  max_regression: 1.02

mlflow:
  # sqlite rather than a plain file store: the model registry and its aliases need a
  # database backend. The containerised Postgres server arrives in Phase 10.
  tracking_uri: sqlite:///mlruns/mlflow.db
  experiment: pl-load-forecasting
  registered_model_name: pl_load_lgbm
  champion_alias: champion

backtest:
  initial_train_days: 730         # two years before the first origin
  test_days: 14                   # each origin predicts the following fortnight
  step_days: 14                   # blocks tile without overlapping
  # 26 fortnights = 364 days, so the accumulated predictions cover a full year of
  # seasons. Each origin is a full refit of every variant, so this is the knob that
  # decides whether the backtest takes minutes or hours.
  max_splits: 26
  quantiles: true                 # also backtest the P10/P50/P90 band
  reports_dir: reports

evaluation:
  peak_hours: [7, 22]             # local clock, start inclusive and end exclusive

state:
  # Everything that cannot be recomputed from the source APIs. Survives between
  # scheduled runs by the mechanism in ADR-008.
  dir: state
  prediction_log: predictions.db
  pipeline_state: pipeline_state.json

serving:
  # How many hourly forecasts one request may ask for, counted from local midnight.
  max_request_hours: 48
  # Open-Meteo forecast days to pull per request. The target hours a day-ahead model
  # can actually reach are bounded by the freshness of the ingested actuals, not by this.
  weather_forecast_days: 3

monitoring:
  reports_dir: monitoring
  current_days: 14                # the window being judged
  reference:
    # "seasonal" compares the current window against the same calendar weeks in
    # previous years; "trailing" compares against the period immediately before it.
    # Electricity load is strongly seasonal, so trailing comparison reports drift every
    # spring and autumn purely because the weather turned. See ADR-009.
    strategy: seasonal
    years_back: 3
    pad_days: 7                   # widen each historical window either side
    min_rows: 500                 # below this the comparison is not worth making
    fallback_to_trailing: true    # in year one there is no seasonal history yet
  # A week of scored hours before production error means anything.
  min_scored_predictions: 168
  # Rolling MAPE of served predictions, in percent, above which a retrain is owed.
  rolling_mape_threshold: 4.0
  # Share of input features that must drift before input drift counts as a trigger.
  drift_share_threshold: 0.3

retraining:
  # Retrain on this cadence even without drift: the world moves slowly as well as
  # suddenly, and a model that is never refreshed decays without ever tripping an alarm.
  cadence_days: 7
  tune: true
  # Tracked runs older than this that no alias points at are deleted, and `mlflow gc`
  # reclaims their artifacts. Without it the state carried between scheduled runs grows
  # by several megabytes per retrain and eventually stops being pushable.
  keep_runs_days: 120
