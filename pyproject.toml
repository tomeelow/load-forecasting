[project]
name = "pl-load-forecasting"
version = "0.1.0"
description = "Day-ahead electricity load forecasting for the Polish bidding zone, benchmarked against PSE's official forecast."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "entsoe-py==0.8.0",
    "evidently==0.7.21",
    "fastapi==0.141.1",
    "holidays==0.102",
    "httpx==0.28.1",
    "lightgbm==4.7.0",
    "loguru==0.7.3",
    "matplotlib==3.11.1",
    "mlflow==3.15.1",
    "numpy==2.4.6",
    "optuna==4.9.0",
    "pandas==2.3.3",
    "pandera==0.32.1",
    "pyarrow==23.0.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "uvicorn==0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "pipelines"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff formats Python code blocks inside Markdown; docs/ holds the spec, leave it alone.
extend-exclude = ["*.md", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]
ignore = [
    "ANN001", # annotations are required on public functions, not on every local/test arg
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "N803",   # `X` for a design matrix is the universal convention in ML code
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::FutureWarning",
    # starlette's TestClient prefers httpx2; not our code and not worth a dependency
    # whose only job is to silence a warning.
    "ignore:Using `httpx` with `starlette.testclient`",
    # Evidently's internals: a tz-aware index it converts to periods, a numpy alias and
    # litestar deprecations. All third-party, none actionable here.
    "ignore:Converting to PeriodArray/Index representation will drop timezone information",
    "ignore:numpy.core is deprecated",
    "ignore:Call to deprecated function 'Dependency'",
    "ignore:Use of deprecated class 'DependencyKwarg'",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "ruff==0.16.1",
]
