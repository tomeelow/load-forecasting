[project]
name = "pl-load-forecasting"
version = "0.1.0"
description = "Day-ahead electricity load forecasting for the Polish bidding zone, benchmarked against PSE's official forecast."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "entsoe-py==0.8.0",
    "holidays==0.102",
    "loguru==0.7.3",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "pandera==0.32.1",
    "pyarrow==25.0.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "pipelines"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]
ignore = [
    "ANN001", # annotations are required on public functions, not on every local/test arg
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::FutureWarning"]

[dependency-groups]
dev = [
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "ruff==0.16.1",
]
